name: Tests

on:
  push:
  pull_request:

env:
  DB_DATABASE: testing
  DB_USERNAME: testing
  DB_PASSWORD: testing
  APP_KEY: deela5kinohw0haekoothahSh8eexach

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    container:
      image: php:${{ matrix.php }}-fpm

    defaults:
      run:
        working-directory: ${{ github.workspace }}

    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2']

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: testing
          MYSQL_USER: testing
          MYSQL_PASSWORD: testing
          MYSQL_ROOT_PASSWORD: root
          MYSQL_ROOT_HOST: '%'
        options: >-
          --health-cmd="mysqladmin ping -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      mysql2:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: testing
          MYSQL_USER: testing
          MYSQL_PASSWORD: testing
          MYSQL_ROOT_PASSWORD: root
          MYSQL_ROOT_HOST: '%'
        options: >-
          --health-cmd="mysqladmin ping -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      mariadb:
        image: mariadb:latest
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: yes
          MARIADB_DATABASE: testing
          MARIADB_USER: testing
          MARIADB_PASSWORD: testing
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      mariadb2:
        image: mariadb:latest
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: yes
          MARIADB_DATABASE: testing
          MARIADB_USER: testing
          MARIADB_PASSWORD: testing
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      pgsql:
        image: postgres:14
        env:
          POSTGRES_DB: testing
          POSTGRES_USER: testing
          POSTGRES_PASSWORD: testing
        options: >-
          --health-cmd="pg_isready -U testing"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      pgsql2:
        image: postgres:14
        env:
          POSTGRES_DB: testing
          POSTGRES_USER: testing
          POSTGRES_PASSWORD: testing
        options: >-
          --health-cmd="pg_isready -U testing"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          apt-get -yqq update
          apt-get -yqq install git unzip zip libpq-dev default-mysql-client libpng-dev postgresql-client
          docker-php-ext-install pdo_pgsql pdo_mysql gd

      - name: Install Composer
        run: |
          curl -sS https://getcomposer.org/installer | php
          mv composer.phar /usr/local/bin/composer

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: /root/.composer/cache
          key: ${{ runner.os }}-php-${{ matrix.php }}-composer-${{ hashFiles('composer.json') }}
          restore-keys: ${{ runner.os }}-php-${{ matrix.php }}-composer-

      - name: Install dependencies
        run: composer install -n --prefer-dist --no-progress

      - name: Disable SSL verification for mysql client
        run: printf '[client]\nssl=0\n' > ~/.my.cnf

      - name: Configure MySQL (switch auth plugin for PHP compatibility)
        run: |
          mysql --host=mysql --user=root --password=root \
            -e "ALTER USER 'testing'@'%' IDENTIFIED WITH mysql_native_password BY 'testing'; GRANT ALL PRIVILEGES ON *.* TO 'testing'@'%' WITH GRANT OPTION; FLUSH PRIVILEGES;"
          mysql --host=mysql2 --user=root --password=root \
            -e "ALTER USER 'testing'@'%' IDENTIFIED WITH mysql_native_password BY 'testing'; GRANT ALL PRIVILEGES ON *.* TO 'testing'@'%' WITH GRANT OPTION; FLUSH PRIVILEGES;"

      - name: Configure MariaDB
        run: |
          mysql --host=mariadb --user=root \
            -e "GRANT ALL PRIVILEGES ON *.* TO 'testing'@'%' WITH GRANT OPTION; FLUSH PRIVILEGES;"
          mysql --host=mariadb2 --user=root \
            -e "GRANT ALL PRIVILEGES ON *.* TO 'testing'@'%' WITH GRANT OPTION; FLUSH PRIVILEGES;"

      - name: Configure PostgreSQL
        run: |
          PGPASSWORD=testing psql --host=pgsql --user=testing --dbname=testing \
            -c "GRANT ALL ON SCHEMA public TO testing;"
          PGPASSWORD=testing psql --host=pgsql2 --user=testing --dbname=testing \
            -c "GRANT ALL ON SCHEMA public TO testing;"

      - name: Debug working directory
        run: |
          echo "Shell CWD: $(pwd)"
          echo "GITHUB_WORKSPACE: $GITHUB_WORKSPACE"
          php -r "echo 'PHP CWD: ' . getcwd() . PHP_EOL;"
          ls -la ci.phpunit.xml vendor/bin/phpunit 2>&1 || echo "Files missing!"
          php -r "echo 'ci.phpunit.xml: ' . (file_exists('ci.phpunit.xml') ? 'exists' : 'MISSING') . PHP_EOL;"

      - name: Test (MariaDB)
        run: |
          DB_CONNECTION=mysql DB_HOST=mariadb TENANCY_SYSTEM_CONNECTION_NAME=mysql \
            ./vendor/bin/phpunit -c ci.phpunit.xml

      - name: Test (MySQL, UUID32)
        run: |
          DB_CONNECTION=mysql DB_HOST=mysql LIMIT_UUID_LENGTH_32=1 TENANCY_SYSTEM_CONNECTION_NAME=mysql \
            ./vendor/bin/phpunit -c ci.phpunit.xml

      - name: Test (PostgreSQL)
        run: |
          DB_CONNECTION=pgsql DB_HOST=pgsql TENANCY_SYSTEM_CONNECTION_NAME=pgsql \
            ./vendor/bin/phpunit -c ci.phpunit.xml

      - name: Test (PostgreSQL schema division)
        run: |
          DB_CONNECTION=pgsql DB_HOST=pgsql TENANCY_SYSTEM_CONNECTION_NAME=pgsql \
          TENANCY_DATABASE_DIVISION_MODE=schema \
            ./vendor/bin/phpunit -c ci.phpunit.xml ./tests/unit-tests/Database/ConnectionTest.php

  coverage:
    name: Coverage (PHP 8.1)
    runs-on: ubuntu-latest
    container:
      image: php:8.1-fpm
    if: github.ref_type == 'branch' && endsWith(github.ref_name, '.x')

    defaults:
      run:
        working-directory: ${{ github.workspace }}

    services:
      mariadb:
        image: mariadb:latest
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: yes
          MARIADB_DATABASE: testing
          MARIADB_USER: testing
          MARIADB_PASSWORD: testing
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      mariadb2:
        image: mariadb:latest
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: yes
          MARIADB_DATABASE: testing
          MARIADB_USER: testing
          MARIADB_PASSWORD: testing
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          apt-get -yqq update
          apt-get -yqq install git unzip zip libpq-dev default-mysql-client libpng-dev

      - name: Install PHP extensions and Xdebug
        run: |
          docker-php-ext-install pdo_pgsql pdo_mysql gd
          pecl install xdebug
          docker-php-ext-enable xdebug

      - name: Install Composer
        run: |
          curl -sS https://getcomposer.org/installer | php
          mv composer.phar /usr/local/bin/composer

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: /root/.composer/cache
          key: ${{ runner.os }}-php-8.1-composer-${{ hashFiles('composer.json') }}
          restore-keys: ${{ runner.os }}-php-8.1-composer-

      - name: Install dependencies
        run: composer install -n --prefer-dist --no-progress

      - name: Disable SSL verification for mysql client
        run: printf '[client]\nssl=0\n' > ~/.my.cnf

      - name: Configure MariaDB
        run: |
          mysql --host=mariadb --user=root \
            -e "GRANT ALL PRIVILEGES ON *.* TO 'testing'@'%' WITH GRANT OPTION; FLUSH PRIVILEGES;"
          mysql --host=mariadb2 --user=root \
            -e "GRANT ALL PRIVILEGES ON *.* TO 'testing'@'%' WITH GRANT OPTION; FLUSH PRIVILEGES;"

      - name: Generate coverage report
        run: |
          DB_CONNECTION=mysql DB_HOST=mariadb TENANCY_SYSTEM_CONNECTION_NAME=mysql \
            ./vendor/bin/phpunit -c ci.phpunit.xml --coverage-clover=coverage.xml

      - name: Upload to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml
